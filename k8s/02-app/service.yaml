apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: billing
  annotations:
    # Without this, EKS's legacy in-tree AWS cloud provider defaults to
    # a Classic Load Balancer instead of an NLB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: billing-service
  ports:
    - port: 80
      targetPort: 8080
